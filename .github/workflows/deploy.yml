# Cloudflare 側の Git 連携（Workers Builds）には依存しない。
# ロッカーアプリで「disconnected 状態になって push しても自動デプロイが走らない」問題を踏んでいるため、
# 最初から GitHub Actions で build + wrangler deploy を完結させる。
# 詳細は ../../デプロイ・インフラ運用ノウハウ.md 参照。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Verify fee calculations
        # 料金データを触ったときに、手計算で検証済みの試算表とズレたら気づけるようにする。
        # ここが落ちたらデプロイしない。
        run: npm run verify

      - name: Build and prerender
        # postbuild で静的HTML 153ページ + sitemap.xml + robots.txt を生成する
        run: npm run build
        env:
          VITE_SITE_URL: https://japanproxy.kakuni-lab.com
          VITE_GA4_ID: ${{ vars.GA4_ID }}

      # --- ここから診断ステップ ---
      # Actions のログ本体は認証なしでは読めないが、ステップ名と成否は公開APIから見える。
      # デプロイ失敗の原因（設定ミス / トークン不正 / アカウント違い）を
      # 「どのステップで落ちたか」だけで切り分けられるように分割している。
      # 原因が判明して安定したら、この3ステップは削除してよい。

      - name: Diag1 - wrangler config is valid
        run: npx wrangler deploy --dry-run

      - name: Diag2 - Cloudflare token is valid
        run: |
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "HTTP $code"
          cat /tmp/verify.json
          grep -q '"success":true' /tmp/verify.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Diag3 - account id is reachable with this token
        run: |
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "HTTP $code"
          head -c 400 /tmp/acct.json
          test "$code" = "200"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
